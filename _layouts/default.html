<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fbfaf7">
    <title>{% if page.title %}{{ page.title }} · {% endif %}Eugenie Y. Lai</title>
    {% seo %}
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="site-shell">
      <header class="profile" aria-label="Site header">
        <a class="profile-photo" href="{{ '/' | relative_url }}" aria-label="Eugenie Y. Lai, home">
          <img src="{{ site.logo | relative_url }}" alt="Eugenie Y. Lai" width="220" height="220">
        </a>
        <div class="profile-copy">
          <div class="name-row">
            <a class="site-name" href="{{ '/' | relative_url }}">Eugenie Y. Lai</a>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
              <span aria-hidden="true">◐</span>
            </button>
          </div>
          <p class="role">Systems Research Engineer · <a href="https://aiinfra.google/srg/">SystemsResearch@Google</a></p>
          <p class="contact"><a href="mailto:eylai@mit.edu">eylai [at] mit.edu</a></p>
          <nav class="social-links" aria-label="Profile links">
            <a href="https://scholar.google.com/citations?user=LVZoyz4AAAAJ&hl=en">Scholar</a><span>/</span>
            <a href="https://github.com/ey-l">GitHub</a><span>/</span>
            <a href="https://twitter.com/EugenieLai">Twitter</a><span>/</span>
            <a href="https://www.linkedin.com/in/eugenie-lai">LinkedIn</a>
          </nav>
          <nav class="site-nav" aria-label="Site navigation">
            <a href="{{ '/' | relative_url }}">Research</a>
            <a href="{{ '/blog.html' | relative_url }}">Blog</a>
            <a href="{{ '/miscellaneous.html' | relative_url }}">Gallery</a>
            <a href="{{ '/docs/cvs/cv-eylai.pdf' | relative_url }}">CV</a>
          </nav>
        </div>
      </header>

      <main id="content" class="content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <p>© <span id="current-year">2026</span> Eugenie Y. Lai.</p>
        <p>Layout adapted from <a href="https://github.com/PingchuanMa/PingchuanMa.github.io">Pingchuan Ma’s homepage</a>. Previous theme by <a href="https://github.com/orderedlist">orderedlist</a>.</p>
      </footer>
    </div>

    <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L78RTS8NGL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L78RTS8NGL');
    </script>
  </body>
</html>
